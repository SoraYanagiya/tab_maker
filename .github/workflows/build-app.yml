name: Build standalone app

# push・手動実行のたびに macOS / Windows 向けアプリをビルドし、Artifact として保存する。
# main への push では「latest」ロールングリリースを常に最新化し、
# v* タグを push すると、そのバージョン用の正式なGitHub Releaseも作成する。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: GuitarTabMaker-macOS
            build_script: bash scripts/build_app.sh
            zip_name: GuitarTabMaker-macOS.zip
          - os: windows-latest
            artifact_name: GuitarTabMaker-Windows
            build_script: pwsh scripts/build_app.ps1
            zip_name: GuitarTabMaker-Windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: アプリをビルド
        run: ${{ matrix.build_script }}

      - name: 成果物をZip化 (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GuitarTabMaker.app ${{ matrix.zip_name }}

      - name: 成果物をZip化 (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/GuitarTabMaker -DestinationPath dist/${{ matrix.zip_name }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.zip_name }}
          retention-days: 30

  # main への push のたびに、常に最新版をダウンロードできる「latest」リリースを更新する。
  # macOS/Windowsの2ジョブが同時にReleaseへ書き込むと競合するため、
  # 両方のビルドが終わった後にこのジョブでまとめて1回だけ公開する。
  publish-latest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Releaseに添付するファイルをまとめる
        run: |
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "最新ビルド（mainブランチ）"
          body: "mainブランチへのpushのたびに自動更新される最新ビルド。安定版は[Releases](../../releases)のバージョンタグ付きリリースを参照。"
          prerelease: true
          files: release-assets/*.zip

  # v* タグを push したときは、そのバージョン用の正式なリリースも作成する。
  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Releaseに添付するファイルをまとめる
        run: |
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
