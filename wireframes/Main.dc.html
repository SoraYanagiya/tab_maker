<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --ink:#2a2a28;
      --muted:#8a8a86;
      --line:#c9c9c4;
      --bg:#f6f5f2;
      --panel:#ffffff;
      --accent: oklch(58% 0.09 250);
      --accent-bg: oklch(58% 0.09 250 / 0.14);
      --warn: oklch(55% 0.14 55);
      --warn-bg: oklch(55% 0.14 55 / 0.10);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);}
    a{color:var(--accent);} a:hover{color:var(--ink);}
    .btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);color:var(--ink);font-size:12px;padding:7px 12px;white-space:nowrap;}
    .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-size:13px;font-weight:600;padding:10px 18px;}
    .icon-btn{width:32px;height:32px;border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);display:flex;align-items:center;justify-content:center;}
    .tag{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:3px;padding:2px 6px;}
    .cap{font-size:9px;color:var(--muted);text-align:center;margin-top:3px;}
    .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px 4px 10px;font-size:11px;background:var(--panel);}
    .switch{width:26px;height:14px;border-radius:999px;position:relative;flex:0 0 auto;}
    .switch.on{background:var(--ink);}
    .switch.off{background:var(--line);}
    .knob{position:absolute;top:2px;width:10px;height:10px;border-radius:999px;background:#fff;}
  </style>
</helmet>
<div style="width:1280px;height:920px;background:var(--bg);display:flex;flex-direction:column;position:relative;">

  <!-- Header: everything global lives here in the combined screen -->
  <div style="height:60px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1.5px solid var(--ink);background:var(--panel);">
    <div style="display:flex;align-items:baseline;gap:12px;">
      <div style="font-size:18px;font-weight:700;">ギターTAB譜メーカー</div>
      <div class="tag">分割表示 / 実際の使用画面イメージ</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="display:flex;gap:6px;">
        <div class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 8L4 12l5 4"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg></div>
        <div class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 8l5 4-5 4"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg></div>
      </div>
      <div class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        読込
      </div>
      <div class="btn primary">
        TAB譜を生成
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <!-- TOP PANE: score input (compact) -->
  <div style="flex:0 0 400px;display:flex;flex-direction:column;padding:14px 24px 10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="font-size:12px;font-weight:700;">五線譜入力</div>
        <div style="display:flex;gap:5px;">
          <div style="width:30px;height:30px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);">
            <svg width="15" height="15" viewBox="0 0 24 24"><ellipse cx="9" cy="16" rx="5" ry="3.6" fill="currentColor" transform="rotate(-18 9 16)"/><line x1="13.5" y1="14.5" x2="13.5" y2="3" stroke="currentColor" stroke-width="1.6"/></svg>
          </div>
          <div style="width:30px;height:30px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;">
            <svg width="15" height="15" viewBox="0 0 24 24"><ellipse cx="9" cy="16" rx="5" ry="3.6" fill="currentColor" transform="rotate(-18 9 16)"/><line x1="13.5" y1="14.5" x2="13.5" y2="3" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 3c3 0 4.5 2 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </div>
          <div style="width:30px;height:30px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;">𝄽</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>小節追加</div>
        <div class="btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>小節削除</div>
      </div>
    </div>

    <div style="flex:1 1 auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:14px 24px;">
      <svg width="1180" height="150" viewBox="0 0 1180 150" style="display:block;">
        <g stroke="var(--ink)" stroke-width="1.1">
          <line x1="0" y1="30" x2="1180" y2="30"/>
          <line x1="0" y1="50" x2="1180" y2="50"/>
          <line x1="0" y1="70" x2="1180" y2="70"/>
          <line x1="0" y1="90" x2="1180" y2="90"/>
          <line x1="0" y1="110" x2="1180" y2="110"/>
        </g>
        <text x="10" y="98" font-size="66" font-family="Georgia, serif" fill="var(--ink)">𝄞</text>
        <g stroke="var(--ink)" stroke-width="1.1">
          <line x1="70" y1="30" x2="70" y2="110"/>
          <line x1="400" y1="30" x2="400" y2="110"/>
          <line x1="740" y1="30" x2="740" y2="110"/>
          <line x1="1176" y1="30" x2="1176" y2="110" stroke-width="2"/>
        </g>

        <!-- highlighted note synced with TAB below -->
        <rect x="290" y="16" width="36" height="102" rx="4" fill="var(--accent-bg)" id="sync-note"/>

        <g>
          <circle cx="120" cy="110" r="5.5" fill="var(--ink)"/><line x1="125.2" y1="107" x2="125.2" y2="76" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="200" cy="90"  r="5.5" fill="var(--ink)"/><line x1="205.2" y1="87" x2="205.2" y2="56" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="308" cy="70"  r="5.5" fill="var(--accent)"/><line x1="313.2" y1="67" x2="313.2" y2="36" stroke="var(--accent)" stroke-width="1.3"/>
          <circle cx="440" cy="90"  r="5.5" fill="var(--ink)"/><line x1="445.2" y1="87" x2="445.2" y2="56" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="520" cy="110" r="5.5" fill="var(--ink)"/><line x1="525.2" y1="107" x2="525.2" y2="76" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="620" cy="70"  r="5.5" fill="var(--ink)"/><line x1="625.2" y1="67" x2="625.2" y2="36" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="800" cy="90"  r="5.5" fill="var(--ink)"/><line x1="805.2" y1="87" x2="805.2" y2="56" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="900" cy="110" r="5.5" fill="var(--ink)"/><line x1="905.2" y1="107" x2="905.2" y2="76" stroke="var(--ink)" stroke-width="1.3"/>
          <circle cx="1010" cy="90" r="5.5" fill="var(--ink)"/><line x1="1015.2" y1="87" x2="1015.2" y2="56" stroke="var(--ink)" stroke-width="1.3"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Divider: resize handle + sync indicator -->
  <div style="flex:0 0 30px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
    <div style="display:flex;gap:3px;">
      <div style="width:4px;height:4px;border-radius:999px;background:var(--muted);"></div>
      <div style="width:4px;height:4px;border-radius:999px;background:var(--muted);"></div>
      <div style="width:4px;height:4px;border-radius:999px;background:var(--muted);"></div>
    </div>
    <div style="position:absolute;left:24px;font-size:10px;color:var(--accent);display:flex;align-items:center;gap:4px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v6M12 15v6M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>
      五線譜 ⇔ TAB 同期（クリックした音がハイライト連動）
    </div>
  </div>

  <!-- BOTTOM PANE: tab preview (compact) -->
  <div style="flex:1 1 auto;display:flex;flex-direction:column;padding:10px 24px 14px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div style="font-size:12px;font-weight:700;margin-right:4px;">TABプレビュー</div>
      <div class="chip"><span>指番号</span><div class="switch on"><div class="knob" style="right:2px;"></div></div></div>
      <div class="chip"><span>ポジション</span><div class="switch on"><div class="knob" style="right:2px;"></div></div></div>
      <div class="chip"><span>手の移動量</span><div class="switch off"><div class="knob" style="left:2px;"></div></div></div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <div class="btn">テキストで書き出し</div>
        <div class="btn">画像で書き出し</div>
      </div>
    </div>

    <div style="flex:1 1 auto;display:flex;gap:14px;">
      <div style="flex:1 1 auto;background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:14px 24px;">
        <svg width="1080" height="170" viewBox="0 0 1080 170">
          <g font-family="Georgia, serif" font-size="13" fill="var(--ink)">
            <text x="0" y="22">e</text><text x="0" y="43">B</text><text x="0" y="64">G</text>
            <text x="0" y="85">D</text><text x="0" y="106">A</text><text x="0" y="127">E</text>
          </g>
          <g stroke="var(--ink)" stroke-width="1">
            <line x1="22" y1="18"  x2="1076" y2="18"/>
            <line x1="22" y1="39"  x2="1076" y2="39"/>
            <line x1="22" y1="60"  x2="1076" y2="60"/>
            <line x1="22" y1="81"  x2="1076" y2="81"/>
            <line x1="22" y1="102" x2="1076" y2="102"/>
            <line x1="22" y1="123" x2="1076" y2="123"/>
          </g>
          <g stroke="var(--line)" stroke-width="1">
            <line x1="350" y1="18" x2="350" y2="123"/>
            <line x1="690" y1="18" x2="690" y2="123"/>
          </g>

          <!-- highlight aligned under the staff highlight above -->
          <rect x="298" y="6" width="40" height="128" fill="var(--accent-bg)" rx="4"/>

          <g font-size="13" text-anchor="middle" fill="var(--ink)">
            <text x="90"  y="85">3</text>
            <text x="170" y="60">5</text>
            <text x="250" y="43">3</text>
            <text x="318" y="43" fill="var(--accent)" font-weight="700">5</text>
            <text x="420" y="60">7</text>
            <text x="500" y="85">5</text>
            <text x="580" y="106">0</text>
            <text x="730" y="85">2</text>
            <text x="820" y="60">3</text>
            <text x="940" y="43">2</text>
            <text x="1010" y="85">0</text>
          </g>

          <g font-size="9" fill="#fff">
            <circle cx="170" cy="46" r="7" fill="var(--ink)"/><text x="170" y="49" text-anchor="middle">2</text>
            <circle cx="250" cy="29" r="7" fill="var(--ink)"/><text x="250" y="32" text-anchor="middle">1</text>
            <circle cx="318" cy="29" r="7" fill="var(--accent)"/><text x="318" y="32" text-anchor="middle">3</text>
          </g>

          <g stroke="var(--muted)" stroke-width="1.1" fill="none">
            <path d="M170 142 L170 148 L500 148 L500 142"/>
          </g>
          <text x="335" y="163" font-size="10" fill="var(--muted)" text-anchor="middle">5フレットポジション</text>
        </svg>
      </div>

      <!-- compact warnings -->
      <div style="width:260px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;">
        <div style="font-size:11px;font-weight:700;margin-bottom:8px;">警告 (2)</div>
        <div style="display:flex;gap:6px;padding:8px;background:var(--warn-bg);border-radius:4px;margin-bottom:6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="1.8" style="flex:0 0 auto;margin-top:1px;"><path d="M12 3l10 18H2z"/><line x1="12" y1="10" x2="12" y2="15"/></svg>
          <div style="font-size:10.5px;line-height:1.5;">3小節目: ポジション移動が大きい（3→9フレット）</div>
        </div>
        <div style="display:flex;gap:6px;padding:8px;background:var(--warn-bg);border-radius:4px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="1.8" style="flex:0 0 auto;margin-top:1px;"><path d="M12 3l10 18H2z"/><line x1="12" y1="10" x2="12" y2="15"/></svg>
          <div style="font-size:10.5px;line-height:1.5;">4小節目: 同弦連続運指で指の重なりの可能性</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
